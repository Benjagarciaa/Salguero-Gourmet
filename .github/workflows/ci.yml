name: CI

# En cada push y pull request: tipos, lint, tests y build (lo mismo que
# `npm run check` más el build). Vercel arma el deploy por su cuenta; esto
# avisa antes, en GitHub, si algo se rompió.
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
